<nz-table
  #basicTable
  *ngIf="data"
  [nzData]="showData"
  [nzLoading]="loading"
  [nzFrontPagination]="false"
  [nzShowPagination]="false"
>
  <thead>
    <tr>
      <th [colSpan]="expandTemplate ? 2 : 1"></th>
      <th *ngFor="let field of config.fields">{{ field.label | translate }}</th>
      <th *ngIf="!config.disableOption" nzRight>
        {{ "common.option" | translate }}
      </th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngFor="let record of basicTable.data">
      <tr>
        <td
          style="width: 20px"
          [nzChecked]="setOfCheckedId.has(getKeyValue(record))"
          (nzCheckedChange)="onItemChecked(getKeyValue(record), $event)"
        ></td>
        <td
          style="width: 20px"
          *ngIf="expandTemplate"
          [nzExpand]="expandSet.has(getValue(record, config.key))"
          (nzExpandChange)="
            onExpandChange(getValue(record, config.key), $event)
          "
        ></td>
        <td
          *ngFor="let field of config.fields"
          [innerHTML]="getDisplayedValue(record, field)"
        ></td>

        <td style="width: 200px" *ngIf="!config.disableOption" nzRight>
          <button
            *ngIf="!config.disableDetail"
            nz-button
            nzType="text"
            (click)="detail(record)"
          >
            {{ "common.detail" | translate }}
          </button>
          <button
            *ngIf="!config.disableUpdate"
            nz-button
            nzType="text"
            (click)="update(record)"
          >
            {{ "common.update" | translate }}
          </button>
          <button
            *ngIf="!config.disableDelete"
            nz-button
            nzType="text"
            nzDanger
            (click)="delete(record)"
          >
            {{ "common.delete" | translate }}
          </button>
        </td>
      </tr>
      <tr
        *ngIf="expandTemplate"
        [nzExpand]="expandSet.has(getValue(record, config.key))"
      >
        <ng-container
          [ngTemplateOutlet]="expandTemplate"
          [ngTemplateOutletContext]="{ data: record }"
        >
        </ng-container>
      </tr>
    </ng-container>
  </tbody>
</nz-table>
<br />
<nz-pagination
  [nzTotal]="getTotal()"
  [nzPageSize]="getPageSize()"
  [nzPageIndex]="getPageIndex()"
  (nzPageIndexChange)="onPageIndexChange($event)"
></nz-pagination>
<br />
