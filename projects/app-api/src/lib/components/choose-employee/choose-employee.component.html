<nz-select nzAllowClear nzShowSearch [nzPlaceHolder]="'common.selectEmployee' | translate"
           [(ngModel)]="employeeId" (ngModelChange)="onChangeData($event)">
  <nz-option
    *ngFor="let employeeTeacher of employees"
    nzLabel="{{employeeTeacher.code?.toUpperCase() + ' - ' + employeeTeacher.name }}"
    nzValue="{{ employeeTeacher.id }}"
  ></nz-option>
</nz-select>
