<nz-table
  #filterTable
  nzShowSizeChanger
  [nzData]="devices"
  [nzFrontPagination]="false"
  [nzLoading]="isLoading"
  [nzTotal]="total"
  [nzPageIndex]="pageIndex"
  [nzPageSize]="pageSize"
  (nzQueryParams)="onQueryParamsChange($event)"
>
  <thead>
    <tr>
      <th nzWidth="40px"></th>
      <th
        *ngFor="let column of tableColumns"
        [nzColumnKey]="column.key"
        [nzSortFn]="true"
      >
        {{ column.name | translate }}
      </th>
      <th *ngIf="isShowOption">{{ "common.option" | translate }}</th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngFor="let data of filterTable.data">
      <tr>
        <td
          [nzExpand]="tableRowExpandSet.has(data.id ?? 0)"
          (nzExpandChange)="onExpandChange(data.id ?? 0, $event)"
        ></td>
        <td>{{ data.id }}</td>
        <td>{{ data.code }}</td>
        <td>{{ data.name }}</td>
        <td>{{ data.description }}</td>
        <td
          [ngClass]="{
            online: data.status == 'ONLINE',
            offline: data.status == 'OFFLINE'
          }"
        >
          {{ data.status }}
        </td>
        <td *ngIf="isShowOption">
          <button nz-button nzType="primary" (click)="handleToDetail(data)">
            {{ "common.detail" | translate }}
          </button>
        </td>
      </tr>
      <tr [nzExpand]="tableRowExpandSet.has(data.id || 0)">
        <app-admin-device-log-chart
          *ngIf="tableRowExpandSet.has(data.id || 0)"
          [deviceId]="data.id"
          [deviceLogs]="data.deviceLogs"
        ></app-admin-device-log-chart>
      </tr>
    </ng-container>
  </tbody>
</nz-table>
