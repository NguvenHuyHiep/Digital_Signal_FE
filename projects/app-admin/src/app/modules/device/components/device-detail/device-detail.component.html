<lh-common-page>
  <div class="mb-2" nz-space>
    <button (click)="navigateToPrevious()" nz-button>
      {{ "common.back" | translate }}
    </button>
  </div>
  <div [nzGutter]="[16, 16]" nz-row>
    <div nz-col nzSpan="24">
      <nz-card>
        <div id="device-log-chart1"></div>
      </nz-card>
    </div>
  </div>
  <div [nzGutter]="[16, 16]" nz-row>
    <nz-table #filterTable [nzData]="deviceLogs" nzTableLayout="fixed" nz-col>
      <thead>
        <tr>
          <th
            *ngFor="let column of tableColumns"
            [nzSortOrder]="column.sortOrder"
            [nzSortFn]="column.sortFn"
            [nzSortDirections]="column.sortDirections"
            [nzFilterMultiple]="column.filterMultiple"
            [nzFilters]="column.listOfFilter"
            [nzFilterFn]="column.filterFn"
          >
            {{ column.name }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of filterTable.data">
          <td>{{ data.id }}</td>
          <td>{{ data.status }}</td>
          <td>{{ data.date | date : "dd/M/yyyy - h:mm:ss a - z" }}</td>
        </tr>
      </tbody>
    </nz-table>
  </div>
</lh-common-page>
