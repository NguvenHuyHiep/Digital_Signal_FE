<lh-common-page>
  <div class="mb-2" nz-space>
    <button (click)="navigateToPrevious()" nz-button nzType="primary">
      {{ "common.back" | translate }}
    </button>
  </div>
  <div [nzGutter]="[16, 16]" nz-row>
    <div nz-col nzSpan="24">
      <nz-card>
        <div id="device-log-chart1"></div>
      </nz-card>
    </div>
  </div>
  <div [nzGutter]="[16, 16]" nz-row>
    <lh-common-lh-table
      nz-col
      nzSpan="24"
      #table
      [data]="deviceLogs"
      [config]="tableConfig"
      [loading]="loading.searching"
      (onDetail)="navigateToDetail($event)"
    >
    </lh-common-lh-table>
  </div>
</lh-common-page>
