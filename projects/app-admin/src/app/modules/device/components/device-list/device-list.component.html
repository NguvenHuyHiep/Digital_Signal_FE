<lh-common-page pageTitle="{{ 'module.device.title' | translate }}">
  <form [formGroup]="searchForm" [nzGutter]="[16, 16]" nz-row>
    <nz-col nzSpan="6">
      <nz-input-group nzSearch [nzAddOnAfter]="suffixIconButton">
        <input
          nz-input
          formControlName="keyword"
          placeholder="{{ 'common.search' | translate }}"
        />
      </nz-input-group>
    </nz-col>
    <nz-select nz-col nzSpan="4" formControlName="status">
      <nz-option
        *ngFor="let option of statusOptions"
        [nzLabel]="option.label | translate"
        [nzValue]="option.value"
      ></nz-option>
    </nz-select>
  </form>

  <div [nzGutter]="[16, 16]" nz-row>
    <app-admin-device-table
      nz-col
      nzSpan="24"
      [isShowOption]="true"
      [status]="statusSelect"
      [keyword]="searchKeyword"
      (onHandleToDetail)="navigateToDetail($event)"
    ></app-admin-device-table>
  </div>
</lh-common-page>

<ng-template #suffixIconButton>
  <button
    nz-button
    nzType="primary"
    nzSearch
    type="submit"
    (click)="onClearKeyword()"
  >
    <span nz-icon nzType="close-circle" nzTheme="outline"></span>
  </button>
</ng-template>
