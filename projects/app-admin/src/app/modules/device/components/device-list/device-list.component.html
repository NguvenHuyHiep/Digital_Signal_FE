<lh-common-page pageTitle="{{ 'module.device.title' | translate }}">
  <div [nzGutter]="[16, 16]" nz-row nzAlign="middle">
    <div nz-col nzSpan="2">
      <nz-select
        style="width: 100px"
        [(ngModel)]="statusSelect"
        (ngModelChange)="onStatusChange($event)"
      >
        <nz-option
          *ngFor="let option of statusOptions"
          [nzLabel]="option.label | translate"
          [nzValue]="option.value"
        ></nz-option>
      </nz-select>
    </div>
  </div>

  <div [nzGutter]="[16, 16]" nz-row>
    <!-- <lh-common-lh-table
      nz-col
      nzSpan="24"
      #table
      [data]="devices"
      [config]="tableConfig"
      [loading]="loading.searching"
      (onDetail)="navigateToDetail($event)"
      [expandTemplate]="deviceDetail"
    >
    </lh-common-lh-table> -->
    <nz-table
      #filterTable
      nzShowSizeChanger
      nzTableLayout="fixed"
      [nzData]="devices"
      [nzFrontPagination]="false"
      [nzLoading]="loading.searching"
      [nzTotal]="total"
      [nzPageIndex]="pageIndex"
      [nzPageSize]="pageSize"
      (nzQueryParams)="onQueryParamsChange($event)"
      nz-col
    >
      <thead>
        <tr>
          <th></th>
          <th
            *ngFor="let column of tableColumns"
            [nzColumnKey]="column.key"
            [nzSortFn]="true"
          >
            {{ column.name | translate }}
          </th>
          <th>{{ "common.option" | translate }}</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let data of filterTable.data">
          <tr>
            <td
              [nzExpand]="expandSet.has(data.id || 0)"
              (nzExpandChange)="onExpandChange(data.id || 0, $event)"
            ></td>
            <td>{{ data.id }}</td>
            <td>{{ data.code }}</td>
            <td>{{ data.name }}</td>
            <td>{{ data.information }}</td>
            <td>{{ data.status }}</td>
            <td>
              <button
                nz-button
                nzType="primary"
                (click)="navigateToDetail(data)"
              >
                {{ "common.preview" | translate }}
              </button>
            </td>
          </tr>
          <tr [nzExpand]="expandSet.has(data.id || 0)">
            <app-admin-device-chart
              *ngIf="expandSet.has(data.id || 0)"
              [device]="data"
            ></app-admin-device-chart>
          </tr>
        </ng-container>
      </tbody>
    </nz-table>
  </div>
</lh-common-page>
