<lh-common-page pageTitle="{{ 'module.playlist.title' | translate }}">
  <div nz-space>
    <button
      (click)="navigateToCreate()"
      nz-button
      nzType="primary"
      class="mb-2 btnFunction"
    >
      {{ "common.add" | translate }}
    </button>
    <button
      nz-button
      nzType="primary"
      class="mb-2"
      [disabled]="!isSelectedRow"
      (click)="deleteSelected()"
      nzDanger
    >
      {{ "common.delete" | translate }}
    </button>
  </div>

  <lh-common-lh-table
    #table
    [data]="playlists"
    [config]="tableConfig"
    [loading]="loading.searching"
    (onUpdate)="navigateToUpdate($event)"
    (onDelete)="delete($event)"
    (onDetail)="navigateToDetail($event)"
  ></lh-common-lh-table>
</lh-common-page>
