<nz-table
  #filterTable
  nzShowSizeChanger
  nzBordered
  [nzTitle]="'module.groupDevice.listDevice' | translate"
  [nzData]="devices"
  [nzFrontPagination]="false"
  [nzLoading]="isLoading"
  [nzTotal]="total"
  [nzPageIndex]="pageIndex"
  [nzPageSize]="pageSize"
  (nzQueryParams)="onQueryParamsChange($event)"
>
  <thead>
    <tr>
      <th
        *ngFor="let column of tableColumns"
        [nzColumnKey]="column.key"
        [nzSortFn]="true"
      >
        {{ column.name | translate }}
      </th>
      <th *ngIf="isShowOption">{{ "common.option" | translate }}</th>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngFor="let data of filterTable.data">
      <tr>
        <td>{{ data.id }}</td>
        <td>{{ data.code }}</td>
        <td>{{ data.name }}</td>
        <td>{{ data.description }}</td>
        <td
          [ngClass]="{
            online: data.status == 'ONLINE',
            offline: data.status == 'OFFLINE'
          }"
        >
          {{ data.status }}
        </td>
        <td *ngIf="isShowOption">
          <button
            nz-button
            nzDanger
            (click)="onRemoveDeviceFromDeviceGroup(data)"
          >
            {{ "button.remove" | translate }}
          </button>
        </td>
      </tr>
    </ng-container>
  </tbody>
</nz-table>
