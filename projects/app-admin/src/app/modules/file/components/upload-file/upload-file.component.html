<nz-upload
  nzType="drag"
  [nzMultiple]="false"
  [nzFileList]="fileList"
>
  <p class="ant-upload-drag-icon">
    <span nz-icon nzType="inbox"></span>
  </p>
  <p class="ant-upload-text">{{ 'common.clickOrDragToUpload' | translate}}</p>
  <p class="ant-upload-hint">
    Support for a single or bulk upload. Strictly prohibit from uploading company data or other band files
  </p>
</nz-upload>
<ng-container *ngIf="fileList && fileList.length > 0">
  <ng-container *ngFor="let file of fileList">
    <ng-container >
      <img  [src]="file.url" style="width: 100%" />
    </ng-container>
    <ng-container >
      <audio controls>
        <source [src]="file.url">
        Trình duyệt không hỗ trợ định dạng
      </audio>
    </ng-container>
    <ng-container >
      <video controls width="250">
        <source [src]="file.url">
        Trình duyệt không hỗ trợ định dạng
      </video>
    </ng-container>
  </ng-container>
</ng-container>
