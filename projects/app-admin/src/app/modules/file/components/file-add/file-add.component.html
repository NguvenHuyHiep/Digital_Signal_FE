<lh-common-page>
  <div class="mb-2" nz-space>
    <button (click)="navigateToPrevious()" nz-button nzType="primary">
      {{ "common.back" | translate }}
    </button>
  </div>
  <div class="mb-2" nz-space>
    <button (click)="uploadFiles()" nz-button nzType="primary">
      {{ "module.file.add" | translate }}
    </button>
  </div>
  <div [nzGutter]="[16, 16]" nz-row>
    <div nz-col nzSpan="24">
      <nz-upload
        nzType="drag"
        [nzMultiple]="true"
        [nzFileList]="fileList"
        [nzBeforeUpload]="beforeUpload"
        [nzShowUploadList]="false"
      >
        <p class="ant-upload-drag-icon">
          <span nz-icon nzType="inbox"></span>
        </p>
        <p class="ant-upload-text">
          {{ "module.file.upload.text" | translate }}
        </p>
        <p class="ant-upload-hint">
          {{ "module.file.upload.hint" | translate }}
        </p>
      </nz-upload>
    </div>
  </div>
  <div [nzGutter]="[16, 16]" nz-row>
    <div nz-col nzSpan="24">
      <lh-common-lh-table
        #table
        [data]="fileList"
        [config]="tableConfig"
        (onDelete)="deleteFile($event)"
      ></lh-common-lh-table>
    </div>
  </div>
</lh-common-page>
