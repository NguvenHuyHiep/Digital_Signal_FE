<lh-common-page pageTitle="{{ 'module.file.title' | translate }}">
  <div nz-space>
    <button
      (click)="navigateToCreate()"
      nz-button
      nzType="primary"
      class="mb-2 btnFunction"
    >
      {{ "common.add" | translate }}
    </button>
  </div>

  <lh-common-lh-table
    #table
    [data]="files"
    [config]="tableConfig"
    [loading]="loading.searching"
    (onDelete)="delete($event)"
    (onDetail)="navigateToDetail($event)"
    (onPreview)="preview($event)"
  ></lh-common-lh-table>

  <nz-modal
    [(nzVisible)]="previewFile.isVisible"
    [nzTitle]="modalTitle"
    [nzContent]="modalContent"
    [nzFooter]="modalFooter"
    (nzOnOk)="onDownload()"
    (nzOnCancel)="onCancel()"
  >
    <ng-template #modalTitle> {{ previewFile.dsdFile?.path }} </ng-template>
    <ng-template #modalContent>
      <div *ngIf="!previewFile.src" class="preview-loading">
        <nz-spin nzSimple></nz-spin>
      </div>
      <img
        *ngIf="previewFile.src && isFile(previewFile.dsdFile?.fileType)"
        width="100%"
        height="auto"
        [src]="previewFile.src"
        alt="{{ previewFile.dsdFile?.path }}"
      />
      <video
        *ngIf="previewFile.src && !isFile(previewFile.dsdFile?.fileType)"
        width="100%"
        height="auto"
        controls
      >
        <source
          [src]="previewFile.src"
          type="{{ previewFile.dsdFile?.fileType }}"
        />
        {{ "error.video-not-support" | translate }}
      </video>
    </ng-template>
    <ng-template #modalFooter>
      <button
        nz-button
        nzType="default"
        (click)="previewFile.isVisible = false"
      >
        {{ "button.close" | translate }}
      </button>
      <button nz-button nzType="primary" (click)="onDownload()">
        {{ "button.download" | translate }}
      </button>
    </ng-template>
  </nz-modal>
</lh-common-page>
