cache:
  untracked: true
  key: "$CI_BUILD_REF_NAME"
  paths:
    - node_modules/
stages:
  - build-base-staging
  - deploy-staging


build-base-staging:
  stage: build-base-staging
  only:
    refs:
      - staging
    changes:
      - package*.json
  tags:
    - dsd
  before_script:
    - docker login http://aninfosys.asia:8082 -u bouser -p Bo@123!@#
  script:
    - docker login http://aninfosys.asia:8082 -u bouser -p Bo@123!@#
    - echo "--------------------Run CI for commit $CI_COMMIT_SHA --------------------"
    - echo "====================== BUILD BASE DOCKER IMAGE FOR STAGING ON COMMIT $CI_COMMIT_TAG========================="
    - docker build -t aninfosys.asia:8082/lpdev/dsd/dsd-fe-cache-staging:latest  -f ./docker/Dockerfile_cache .
    - echo "====================== PUSH DOCKER IMAGE TO REPOSITORY ========================="
    - docker push aninfosys.asia:8082/lpdev/dsd/dsd-fe-cache-staging:latest

deploy-staging:
  stage: deploy-staging
  tags:
    - dsd
  only:
    refs:
      - staging
  before_script:
    - docker login http://aninfosys.asia:8082 -u bouser -p Bo@123!@#
  script:
    - echo "--------------------Run CI for commit $CI_COMMIT_SHA --------------------"
    - echo "====================== BUILD DOCKER IMAGE FOR STAGING ON COMMIT $CI_COMMIT_TAG========================="
    - docker build -t aninfosys.asia:8082/lpdev/dsd/nginx-staging:latest  -f ./docker/Dockerfile_staging .
    - echo "====================== PUSH DOCKER IMAGE FOR STAGING ON COMMIT $CI_COMMIT_TAG========================="
    - docker push aninfosys.asia:8082/lpdev/dsd/nginx-staging:latest
    - echo "====================== DEPLOY FRONTEND FOR STAGING ON COMMIT $CI_COMMIT_TAG========================="
    - docker stack deploy dsd_staging --resolve-image always --compose-file docker/docker-compose-staging.yml --with-registry-auth

