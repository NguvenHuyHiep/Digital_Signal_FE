# Use root/Abcd1234 as user/password credentials
version: '3.1'

services:
  postgres:
    image: postgres:16.0
    container_name: dsd_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lpdev
      POSTGRES_PASSWORD: Abcd1234
      POSTGRES_DB: dsd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dsd_internal

  minio:
    image: minio/minio
    container_name: dsd_minio
    command: server /data --console-address ":9090"
    restart: always
    ports:
      - "9001:9000"
      - "9091:9090"
    environment:
      MINIO_ROOT_USER: lpdev
      MINIO_ROOT_PASSWORD: Abcd1234
    volumes:
      - minio_data:/data
    networks:
      - dsd_internal

networks:
  dsd_internal: