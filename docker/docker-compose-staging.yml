# Use root/Abcd1234 as user/password credentials
version: '3'

services:

  nginx:
    image: aninfosys.asia:8082/lpdev/dsd/nginx-staging:latest
    deploy:
      restart_policy:
        condition: any
      replicas: 1
      placement:
        constraints:
          - node.hostname == vmi888571
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: "dsdstaging.vnditech.com"
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: "dsdstaging.vnditech.com"
      LETSENCRYPT_EMAIL: "rvdung@gmail.com"
    networks:
      - dsd_internal
      - dsd_external

networks:
  dsd_internal:
  dsd_external:
    external: true
    name: "anfo"

